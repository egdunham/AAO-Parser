<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AAO Guide Converter</title>
        <link rel="stylesheet" href="/src/styles.css" />
        <script src="/node_modules/papaparse/papaparse.js"></script>
    </head>

    <body>
        <div class="row">
            <!-- Left-hand nav menu. Snap to single column on screen resize -->
             <div class="col-6 col-s-12">
                <div>
                    <img src="/src/images/aao2.jpg" alt="Arizona Archives Online Logo"/>
                </div>
                <div class="left-menu">
                    <ul>
                        <li>I'M A TEST</li>
                        <li>ME TOO</li>
                    </ul>
                </div>
             </div>
             
              <div class="col-3 col-s-3" id="content">
                <div>
                    <form class="input-format">
                        <h2>Repository Information</h2>
                        <div class="input-box">
                            <label for="repo_code">MARC Code:</label>
                            <input type="text" id="repo_code">
                        </div>

                        <div class="input-box">
                            <label for="repo_name">Name:</label>
                            <input type="text" id="repo_name">
                        </div>

                        <div class="input-box">
                            <label for="repo_address_1">Address (Line 1):</label>
                            <input type="text" id="repo_address_1">
                        </div>

                        <div class="input-box">
                            <label for="repo_address_2">Address (Line 2):</label>
                            <input type="text" id="repo_address_2">
                        </div>

                        <div class="input-box">
                            <label for="repo_phone">Phone Number:</label>
                            <input type="tel" id="repo_phone">
                        </div>

                        <div class="input-box">
                            <label for="repo_email">E-Mail:</label>
                            <input type="email" id="repo_email">
                        </div>
                    </form>
                </div>
                <div class="spacer"></div>

                <!-- Repository information -->
                <div>
                    <form class="input-format">
                        <h2>Technical Information</h2>
                        <div class="input-box">
                            <label for="guide_filetitle">Guide File Name:</label>
                            <input type="text" id="guide_filetitle">
                        </div>

                        <div class="input-box">
                            <label for="guide_author">Finding Aid Author:</label>
                            <input type="text" id="guide_author">
                        </div>

                        <div class="input-box">
                            <label for="guide_lang">Finding Aid Language:</label>
                            <input type="text" id="guide_lang">
                        </div>
                    </form>
                </div>

                <div class="spacer"></div>

                <!-- Overview -->
                <div>
                    <form class="input-format">
                        <h2>Collection Overview</h2>
                        <div class="input-box">
                            <label for="coll_id">Identifier:</label>
                            <input type="text" id="coll_id">
                        </div>
                        
                        <div class="input-box">
                            <label for="coll_title">Title:</label>
                            <input type="text" id="coll_title">
                        </div>

                        <div class="input-box">
                            <label for="coll_filetitle">Filing Title:</label>
                            <input type="text" id="coll_filetitle">
                        </div>

                        <div class="input-box">
                            <label for="coll_dates">Dates:</label>
                            <input type="text" id="coll_dates">
                        </div>

                        <div class="input-box">
                            <label for="coll_boxes">Boxes:</label>
                            <input type="number" id="coll_boxes">
                        </div>

                        <div class="input-box">
                            <label for="coll_lf">Linear Feet:</label>
                            <input type="number" id="coll_lf">
                        </div>

                        <div class="input-box">
                            <label for="coll_lang">Language of Materials:</label>
                            <input type="number" id="coll_lang">
                        </div>

                    </form>
                </div>

                <div class="spacer"></div>


                <!-- Descriptive Notes -->
                <div>
                    <form class="input-format">
                        <h2>Descriptive Notes</h2>
                        <div class="input-box">
                            <label for="coll_abstract">Abstract:</label>
                            <textarea id="coll_abstract" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_historical">Biographical or Historical Note:</label>
                            <textarea id="coll_historical" rows="5"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_scope">Scope and Content Note:</label>
                            <textarea id="coll_scope" rows="5"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_arrangement">Arrangement:</label>
                            <textarea id="coll_arrangement" rows="5"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_access">Access Restrictions:</label>
                            <textarea id="coll_access" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_use">Use Restrictions:</label>
                            <textarea id="coll_use" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_related">Related Materials:</label>
                            <textarea id="coll_related" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_separated">Separated Materials:</label>
                            <textarea id="coll_separated" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_altformats">Alternative Formats:</label>
                            <textarea id="coll_altformats" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_prefcite">Preferred Citation:</label>
                            <textarea id="coll_prefcite" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_acq">Acquisition Information:</label>
                            <textarea id="coll_acq" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_accruals">Accruals:</label>
                            <textarea id="coll_accruals" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_custodhist">Custodial History:</label>
                            <textarea id="coll_custodhist" rows="2"></textarea>
                        </div>

                        <div class="input-box">
                            <label for="coll_procinfo">Processing Information:</label>
                            <textarea id="coll_procinfo" rows="2"></textarea>
                        </div>

                    </form>
                </div>

                <div class="spacer"></div>


                <!-- Drag-and-drop upload box for CSV container list -->
                <div>
                    <form class="upload-wrapper">
                        <h2>Upload Container List</h2>
                        <p>Click below or drag and drop CSV file to upload</p>
                        <div class="upload-zone">
                            <div class="icon bi bi-cloud-upload"></div>
                            <p class="file-name">No File Uploaded</p>
                            <p class="file-size">0.00 KB</p>
                            <input type="file" id="input-file" name="file" accept="image/*">
                        </div>
                        <div class="action-btns">
                            <button type="reset" id="reset-btn">Cancel</button>
                            <button type="submit" id="convert-btn">Convert</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Script governing upload behavior and calling conversion functionalities -->
        <script src="/src/js/index.js" type="module"></script>
        

    </body>

</html>
